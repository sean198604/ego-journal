version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: journal_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Journal@2026
      MYSQL_DATABASE: ego_journal
      MYSQL_USER: journaluser
      MYSQL_PASSWORD: JournalUser@2026
    ports:
      - "3308:3306"
    volumes:
      - journal_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pJournal@2026"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journal_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://journaluser:JournalUser%402026@mysql:3306/ego_journal?charset=utf8mb4
      SECRET_KEY: "ego-journal-secret-key-2026-change-in-prod"
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      UPLOAD_DIR: /app/uploads
    ports:
      - "8002:8000"
    volumes:
      - journal_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: journal_frontend
    restart: always
    ports:
      - "7007:80"
    depends_on:
      - backend

volumes:
  journal_mysql_data:
  journal_uploads:
